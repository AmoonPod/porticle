changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Maintenance
      labels:
        - dependencies
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - '*'
